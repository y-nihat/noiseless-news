name: Daytime ingest

# Deterministic feed capture only — no LLM, no credits. Keeps raw data close to
# publication time so the night loop triages fresher material; dedup by seen_ids
# means the night ingest cost is unchanged.

on:
  schedule:
    - cron: "0 10 * * *"   # 13:00 Istanbul
    - cron: "0 16 * * *"   # 19:00 Istanbul
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

# Shares the nightly group so pushes never race the night loop.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Ingest registered sources
        run: PYTHONPATH=pipeline python -m noiseless.run ingest
      - name: Commit
        run: |
          git config user.name "y-nihat"
          git config user.email "nihat@yinovasyon.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daytime ingest $(date -u +%FT%H:%MZ)"
          # GitHub's ref backend rejected a push once with `remote: fatal error
          # in commit_refs` (2026-08-04, run 30935854819) and the run died with
          # the capture committed but never pushed. seen_ids.json is git-resident,
          # so the runner's state went with it and the items that had already
          # scrolled out of their feed window were lost for good. Retry the way
          # night_loop.sh's commit_push does, with a pause — the fault is
          # server-side and an immediate retry may not clear it.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push attempt $attempt rejected; refetching and retrying"
            sleep $((attempt * 20))
            git pull --rebase || true
          done
          git push
      - name: Refresh site scanner feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Deploy site" --ref main || true

      # The push above raises no workflow event — GitHub does not trigger
      # workflows for pushes authenticated with the run's own GITHUB_TOKEN — so
      # tests.yml's `on: push` never fired for a bot commit and the repo-data
      # tests went 192 commits without running. Dispatch it the same way the
      # deploy has to be dispatched.
      - name: Test the capture
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "Tests" --ref main || true

      # Last, so it can see any earlier step fail. This workflow had no failure
      # handler at all, and two of the twelve failures in this repository's
      # history were daytime ingests: a server-side ref rejection that lost the
      # capture (run 30935854819) and a run GitHub never allocated a runner for
      # (run 31124373444, cancelled with zero steps executed). Neither left
      # anything behind but a red badge in a mailbox that turned out to be read
      # nine days late.
      - name: Say so if the capture failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### $(date -u +%FT%H:%MZ) — daytime ingest failed"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo 'A missed capture is the only permanent loss a bad run causes: Techmeme'
            echo 'and r/LocalLLaMA roll their windows over within hours and nothing'
            echo 'ever re-fetches them.'
            echo
            echo 'Worth checking: whether the commit reached origin, and whether'
            echo 'data/state/seen_ids.json on main still matches the last good run —'
            echo 'that file is git-resident, so a lost push takes the state with it.'
          } > /tmp/ingest-failure.md
          bash .github/scripts/flag_issue.sh \
            "Daytime ingest failed" \
            "Daytime ingest failed $(date -u +%F)" \
            /tmp/ingest-failure.md
