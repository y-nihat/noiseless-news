name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt

      # The publication gate, at the only point every route passes through.
      #
      # The night loop's content gate withholds its own deploys, but it
      # deliberately does not block the commit — the night's work must reach
      # origin either way — so main already carries the article, and the daytime
      # ingest crons dispatch this workflow unconditionally eight to eleven
      # hours later. Without this step the site publishes exactly what the gate
      # refused, just later and with nothing said. Checking here is also
      # recomputed rather than remembered: no sticky hold file for the agent to
      # forge or delete, and a repaired archive publishes on the next run.
      #
      # Deliberately only the content check, not pytest: a flaky unit test has
      # no business freezing the public site.
      - name: The archive holds its invariants
        run: PYTHONPATH=pipeline python -m noiseless.run validate-content --strict

      - run: PYTHONPATH=pipeline python -m noiseless.run publish
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4

      # Every Pages deployment in the repository now comes through here, which
      # makes this the one place a publishing failure can be noticed. It had no
      # handler: both of its historical failures were dispatched by
      # github-actions[bot], and a bot-dispatched run notifies nobody, so runs
      # 30867516175 (2026-08-04) and 31100056995 (2026-08-06) stayed red with no
      # trace anywhere a person looks until they were found on 2026-08-17. A
      # cancelled run is not a failed one, so the `cancel-in-progress`
      # supersessions above stay quiet.
      #
      # The body names the failing step and its duration rather than asserting a
      # cause, because the two historical failures had different ones and an
      # issue that misdirects the responder is worse than a bare red badge.
      - name: Say so if the deploy failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### $(date -u +%FT%H:%MZ) — site deploy failed"
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Commit: ${{ github.sha }}"
            echo
            echo 'Which step failed decides what this is:'
            echo
            echo '- **The archive holds its invariants** — a published article breaks a'
            echo '  blocking rule. The site is deliberately not updated. Fix the article;'
            echo '  the next deploy publishes it. Reproduce with'
            echo '  `docker compose run --rm pipeline python -m noiseless.run validate-content --strict`.'
            echo '- **deploy-pages, around 600s** — a Pages backend stall (run 31100056995,'
            echo '  603s, "Timeout reached, aborting!"). Nothing is wrong with the build;'
            echo '  re-run. PR #24 declined to raise that timeout on purpose, because the'
            echo '  abort is what releases the stuck Pages lock.'
            echo '- **deploy-pages, a second or two** — HTTP 400, another deployment already'
            echo '  in flight (run 30867516175, 1s). Check for a live Pages deployment'
            echo '  before re-running, or it will happen again.'
            echo '- **publish** — a real build failure. Read the log.'
          } > /tmp/deploy-failure.md
          bash .github/scripts/flag_issue.sh \
            "Site deploy failed" \
            "Site deploy failed $(date -u +%F)" \
            /tmp/deploy-failure.md
