name: Tests

# The pipeline's only automated safety net. Runs on every push and pull request
# so a broken build or a regressed duplicate gate is caught before it reaches
# main — and therefore before the deploy workflow ships it to the live site.
#
# This deliberately includes the nightly agent's own commits. It used to skip
# data/ and content/ to save CI minutes, which meant the repo-data tests — the
# ones that check the live archive rather than a fixture — never ran against the
# thing they exist to check. A held story stating an unverified rumour as fact
# sat on the public site for two days behind that exemption (2026-08-05).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r pipeline/requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Source registry parses
        run: PYTHONPATH=pipeline python -m noiseless.run validate-sources
      - name: Published content holds its invariants
        run: PYTHONPATH=pipeline python -m noiseless.run validate-content --strict
      - name: Site builds from the real archive
        run: PYTHONPATH=pipeline python -m noiseless.run publish --out /tmp/site-check
